# =============================================================================
# Render.com 部署配置
# =============================================================================
# 免费方案: Web Service + PostgreSQL
# 部署后地址: https://jinmachine-api.onrender.com
# =============================================================================

services:
  - type: web
    name: jinmachine-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.qq.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        value: 3381641673@qq.com
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        value: 3381641673@qq.com
      - key: IDEMPOTENCY_TTL
        value: "86400"

  - type: pserv
    name: jinmachine-db
    env: docker
    plan: free
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
    envVars:
      - key: POSTGRES_USER
        value: jinmachine
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        value: jinmachine
